name: "uv"

on:
  pull_request:
    paths:
      - "features/uv/config.json"
  push:
    branches:
      - main
    paths:
      - "features/uv/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "uv-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Plan the publishes
        id: plan
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/uv/planPublish.ts --channel "$CHANNEL"
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}

  install-binaries:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            arm64: false
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            arm64: true
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Pack the Feature binary
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ matrix.arm64 && format('ghcr.io/{0}/devcontainer', github.repository) || '' }}
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: ${{ matrix.arm64 && 'filter' || 'never' }}
          refFilterForPush: ${{ matrix.arm64 && 'refs/heads/main' || '' }}
          useNativeRunner: ${{ matrix.arm64 }}
          platform: ${{ matrix.arm64 && 'linux/arm64' || '' }}
          runCmd: pnpm tsx scripts/tasks/features/uv/packFeature.ts --rid "$RID" --out .ci/feature
          env: |
            RID=${{ matrix.rid }}

      - name: Upload the Feature archive
        uses: actions/upload-artifact@v7
        with:
          name: feature-${{ matrix.rid }}
          path: .ci/feature/${{ matrix.rid }}.tar

  image:
    needs:
      - plan
      - install-binaries
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Download the x64 Feature archive
        uses: actions/download-artifact@v7
        with:
          name: feature-linux-x64
          path: .ci/feature

      - name: Download the arm64 Feature archive
        uses: actions/download-artifact@v7
        with:
          name: feature-linux-arm64
          path: .ci/feature

      - name: Publish the image
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/uv/publishImage.ts --component ${{ matrix.component }} --version ${{ matrix.key }} --channel "$CHANNEL" --install-dir .ci/feature
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}

  release-tags:
    needs:
      - plan
      - image
      - verify
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') && needs.verify.result == 'success' }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Apply the release tags
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/uv/releaseTags.ts --channel "$CHANNEL" ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--git-tags' || '' }}
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}

  verify:
    needs:
      - plan
      - image
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
        scenario:
          - binaries
          - python
          - multi
          - download
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Verify the images
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm verify uv --scenario ${{ matrix.scenario }} --images pull --channel "$CHANNEL"
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}
