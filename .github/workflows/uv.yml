name: "uv"

on:
  pull_request:
    paths:
      - "features/uv/config.json"
  push:
    branches:
      - main
    paths:
      - "features/uv/config.json"
  workflow_dispatch:

concurrency:
  group: "uv-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
      packages: write
    with:
      feature: uv
      binaries: true
      scenarios: '["binaries", "python", "multi", "download"]'
