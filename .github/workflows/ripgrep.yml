name: "Ripgrep"

on:
  pull_request:
    paths:
      - "features/ripgrep/config.json"
  push:
    branches:
      - main
    paths:
      - "features/ripgrep/config.json"
  workflow_dispatch:

concurrency:
  group: "ripgrep-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
      packages: write
    with:
      feature: ripgrep
      binaries: false
      scenarios: '["default"]'
