name: "Dotnet"

on:
  pull_request:
    paths:
      - "features/dotnet/config.json"
  push:
    branches:
      - main
    paths:
      - "features/dotnet/config.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "dotnet-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Plan the publishes
        id: plan
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/dotnet/planPublish.ts --channel "$CHANNEL"
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}

  install-binaries:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            arm64: false
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            arm64: true
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Pack the install binary
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ matrix.arm64 && format('ghcr.io/{0}/devcontainer', github.repository) || '' }}
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: ${{ matrix.arm64 && 'filter' || 'never' }}
          refFilterForPush: ${{ matrix.arm64 && 'refs/heads/main' || '' }}
          useNativeRunner: ${{ matrix.arm64 }}
          platform: ${{ matrix.arm64 && 'linux/arm64' || '' }}
          runCmd: pnpm tsx scripts/tasks/features/dotnet/packInstall.ts --rid "$RID" --out .ci/install
          env: |
            RID=${{ matrix.rid }}

      - name: Upload the install binary
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.rid }}
          path: .ci/install/${{ matrix.rid }}/

  image:
    needs:
      - plan
      - install-binaries
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Download the x64 install binary
        uses: actions/download-artifact@v7
        with:
          name: install-linux-x64
          path: .ci/install/linux-x64

      - name: Download the arm64 install binary
        uses: actions/download-artifact@v7
        with:
          name: install-linux-arm64
          path: .ci/install/linux-arm64

      - name: Publish the image
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/dotnet/publishImage.ts --component ${{ matrix.component }} --version ${{ matrix.version }} --channel "$CHANNEL" --install-dir .ci/install
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}

  commit-tags:
    needs:
      - plan
      - image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.image.result == 'success' && needs.plan.outputs.matrix != ''
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Tag the published pair
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/dotnet/tagPublished.ts --component ${{ matrix.component }} --version ${{ matrix.version }}
          env: |
            GH_TOKEN=${{ github.token }}

  verify:
    needs:
      - plan
      - image
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - sdk
          - runtime
          - aspnet
          - multi
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Verify the images
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm verify dotnet --scenario ${{ matrix.scenario }} --images pull --channel "$CHANNEL"
          env: |
            CHANNEL=${{ github.head_ref || github.ref_name }}
            GH_TOKEN=${{ github.token }}
