name: "Dotnet"

on:
  pull_request:
    paths:
      - "features/dotnet/config.json"
  push:
    branches:
      - main
    paths:
      - "features/dotnet/config.json"
  workflow_dispatch:

concurrency:
  group: "dotnet-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: write
      packages: write
    with:
      feature: dotnet
      binaries: true
      scenarios: '["sdk", "runtime", "aspnet", "multi"]'
