name: "Renovate"

on:
  schedule:
    - cron: "0 0 7,21 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [dotnet, ripgrep]
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Refresh the ${{ matrix.feature }} config
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm tsx scripts/tasks/features/${{ matrix.feature }}/renovate.ts
          env: |
            GH_TOKEN=${{ secrets.RENOVATE_TOKEN }}
