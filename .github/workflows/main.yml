name: "Main"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            arm64: false
          - label: ubuntu-24.04-arm
            arm64: true
    runs-on: ${{ matrix.label }}
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Pre-build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer${{ matrix.arm64 && ':latest-linux-arm64' || '' }}
          push: filter
          refFilterForPush: refs/heads/main
          platform: ${{ matrix.arm64 && 'linux/arm64' || '' }}
          useNativeRunner: ${{ matrix.arm64 }}

      - name: Lint
        if: ${{ !matrix.arm64 }}
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm lint

      - name: Test
        if: ${{ !matrix.arm64 }}
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: pnpm test
